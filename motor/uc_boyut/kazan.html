<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
const W=980,H=820;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(W,H); r.setClearColor(0x000000,0);
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05;
r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const sc=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100);
cam.position.set(6.2,4.6,8.4); cam.lookAt(0,1.45,0);

sc.add(new THREE.HemisphereLight(0xfff8e7,0x6d5a3a,1.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(4,9,6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5}); sc.add(sun);
const fill=new THREE.DirectionalLight(0xffe0b0,0.6); fill.position.set(-6,3,-2); sc.add(fill);

// zemin gölgesi
const zem=new THREE.Mesh(new THREE.CircleGeometry(4.2,64),new THREE.ShadowMaterial({opacity:.28}));
zem.rotation.x=-Math.PI/2; zem.receiveShadow=true; sc.add(zem);

// kazan: kesik koni, önü kesik (içi görünsün)
const y0=0.75, h=2.55, rb=1.55, rt=2.05, kes=Math.PI*0.62;
const prof=[]; for(let i=0;i<=20;i++){const t=i/20; prof.push(new THREE.Vector2(rb+(rt-rb)*t, y0+h*t));}
const st=Math.atan2(6.2,8.4)+kes/2, ln=Math.PI*2-kes;
const dis=new THREE.Mesh(new THREE.LatheGeometry(prof,96,st,ln),new THREE.MeshStandardMaterial({color:0xc62828,roughness:.45,metalness:.25,side:THREE.FrontSide}));
dis.castShadow=true; sc.add(dis);
const ic=new THREE.Mesh(new THREE.LatheGeometry(prof.map(p=>new THREE.Vector2(p.x-0.06,p.y)),96,st,ln),new THREE.MeshStandardMaterial({color:0xe9e2d0,roughness:.8,side:THREE.BackSide}));
sc.add(ic);
// kesik kenar şeritleri (et kalınlığı)
for(const a of [st, st+ln]){
  const g=new THREE.BufferGeometry(); const v=[];
  for(let i=0;i<20;i++){const p0=prof[i],p1=prof[i+1];
    const q=(rr,y)=>[Math.sin(a)*rr,y,Math.cos(a)*rr];
    const A=q(p0.x,p0.y),B=q(p0.x-0.06,p0.y),C=q(p1.x,p1.y),D=q(p1.x-0.06,p1.y);
    v.push(...A,...B,...C,...B,...D,...C);}
  g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.computeVertexNormals();
  sc.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x8e1b1b,side:THREE.DoubleSide})));
}
// üst kenar
{const pts=[]; for(let i=0;i<=64;i++){const f=st+ln*i/64; pts.push(new THREE.Vector3(Math.sin(f)*(rt+0.01),y0+h,Math.cos(f)*(rt+0.01)));}
 const k=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),128,0.07,12,false),new THREE.MeshStandardMaterial({color:0xb71c1c,roughness:.4,metalness:.3}));
 k.castShadow=true; sc.add(k);}
// taban
const taban=new THREE.Mesh(new THREE.CylinderGeometry(rb,rb,0.08,64),new THREE.MeshStandardMaterial({color:0x8e1b1b}));
taban.position.y=y0; taban.receiveShadow=true; sc.add(taban);

// helezon (konik: altta geniş, üstte dar)
const mil=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.16,h+0.1,24),new THREE.MeshStandardMaterial({color:0x78909c,metalness:.7,roughness:.3}));
mil.position.y=y0+h/2; mil.castShadow=true; sc.add(mil);
{const N=460, tur=2.6, v=[], idx=[];
 for(let i=0;i<=N;i++){const t=i/N, a=t*tur*Math.PI*2, y=y0+0.12+t*(h-0.35);
   const ro=0.22+(1.32-0.22)*(1-t)**1.1, ri=0.13;
   v.push(Math.cos(a)*ri,y,Math.sin(a)*ri, Math.cos(a)*ro,y+0.03,Math.sin(a)*ro);
   if(i<N){const k=i*2; idx.push(k,k+1,k+2,k+1,k+3,k+2);}}
 const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x90a4ae,metalness:.75,roughness:.28,side:THREE.DoubleSide}));
 m.castShadow=true; sc.add(m);}

// yem: saman çöpleri + silaj + kesif yem, karışık
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
const icinde=(x,y,z)=>{const rr=rb+(rt-rb)*((y-y0)/h)-0.18; return Math.hypot(x,z)<rr-0.12 && Math.hypot(x,z)>0.2;};
const ac=a=>{let d=((a-st)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); return d<ln;};
function doldur(geo,mat,n,ymax,yon){const im=new THREE.InstancedMesh(geo,mat,n); const o=new THREE.Object3D(); let k=0, dene=0;
  while(k<n && dene<n*40){dene++; const y=y0+0.1+rnd()*(ymax), a=rnd()*Math.PI*2, rr=Math.sqrt(rnd())*(rb+(rt-rb)*((y-y0)/h));
    const x=Math.sin(a)*rr, z=Math.cos(a)*rr; if(!icinde(x,y,z)) continue;
    o.position.set(x,y,z); o.rotation.set(rnd()*6,rnd()*6,rnd()*6); const s=0.8+rnd()*0.5; o.scale.set(s,s,s);
    o.updateMatrix(); im.setMatrixAt(k++,o.matrix);}
  im.count=k; im.castShadow=true; im.receiveShadow=true; sc.add(im);}
doldur(new THREE.CylinderGeometry(0.018,0.018,0.42,5),new THREE.MeshStandardMaterial({color:0xe8c547,roughness:.9}),1900,0.95);
doldur(new THREE.IcosahedronGeometry(0.06,0),new THREE.MeshStandardMaterial({color:0x7cb342,roughness:.85,flatShading:true}),1100,0.9);
doldur(new THREE.SphereGeometry(0.045,8,6),new THREE.MeshStandardMaterial({color:0x8d5a2b,roughness:.7}),1100,0.9);

// şasi, tekerler, çeki oku
const koyu=new THREE.MeshStandardMaterial({color:0x37474f,roughness:.6,metalness:.4});
const sasi=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.28,2.0),koyu); sasi.position.y=0.55; sasi.castShadow=true; sc.add(sasi);
const ok=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.14,0.18),koyu); ok.position.set(-2.55,0.5,0); ok.castShadow=true; sc.add(ok);
const lastik=new THREE.MeshStandardMaterial({color:0x1b1b1b,roughness:.9}), jant=new THREE.MeshStandardMaterial({color:0xbdbdbd,metalness:.6,roughness:.35});
for(const x of [-0.85,0.85]) for(const z of [-1.08,1.08]){
  const t=new THREE.Mesh(new THREE.TorusGeometry(0.36,0.16,16,40),lastik); t.position.set(x,0.5,z); t.castShadow=true; sc.add(t);
  const j=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.2,24),jant); j.rotation.x=Math.PI/2; j.position.set(x,0.5,z); sc.add(j);}

r.render(sc,cam);
window.HAZIR=true;
</script></body></html>
